<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streaming Sites Directory - Enhanced with Ratings & Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-1: #070617;
        --bg-2: #0f1026;
        --accent-a: #00f0ff;
        --accent-b: #ff4bd6;
        --glass: rgba(255, 255, 255, 0.04);
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial;
        color: #e6eef6;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 16px;
        transition: all 0.5s ease;
        min-height: 100vh;
      }

      /* Theme 1: Cyberpunk (Default) */
      .theme-cyberpunk {
        background: radial-gradient(
            1200px 600px at 10% 10%,
            rgba(0, 240, 255, 0.06),
            transparent 8%
          ),
          radial-gradient(
            900px 500px at 90% 90%,
            rgba(255, 75, 214, 0.05),
            transparent 10%
          ),
          linear-gradient(180deg, #070617 0%, #0f1026 100%);
      }

      /* Theme 2: Dark Space */
      .theme-space {
        background: radial-gradient(
            ellipse at 20% 20%,
            rgba(30, 30, 70, 0.8) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(70, 20, 100, 0.6) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0a0a2e 0%, #1a1a4a 50%, #0f0f23 100%);
      }

      /* Theme 3: Forest */
      .theme-forest {
        background: radial-gradient(
            ellipse at 10% 20%,
            rgba(20, 80, 60, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 90% 80%,
            rgba(30, 100, 80, 0.3) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0a2e1a 0%, #1a4a2e 50%, #0f2318 100%);
      }

      /* Theme 4: Sunset */
      .theme-sunset {
        background: radial-gradient(
            ellipse at 20% 20%,
            rgba(255, 100, 50, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(255, 150, 50, 0.3) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #2e0a0a 0%, #4a1a1a 50%, #230f0f 100%);
      }

      /* Theme 5: Ocean */
      .theme-ocean {
        background: radial-gradient(
            ellipse at 20% 20%,
            rgba(0, 150, 200, 0.3) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 80%,
            rgba(0, 100, 180, 0.3) 0%,
            transparent 50%
          ),
          linear-gradient(135deg, #0a1a2e 0%, #1a2e4a 50%, #0f1823 100%);
      }

      .blob {
        position: fixed;
        filter: blur(60px);
        opacity: 0.5;
        pointer-events: none;
        transition: all 0.5s ease;
      }

      .blob.a {
        left: 6%;
        top: 10%;
        width: 360px;
        height: 360px;
      }

      .blob.b {
        right: 6%;
        bottom: 8%;
        width: 420px;
        height: 420px;
      }

      .theme-cyberpunk .blob.a {
        background: linear-gradient(45deg, var(--accent-a), var(--accent-b));
      }

      .theme-cyberpunk .blob.b {
        background: linear-gradient(45deg, var(--accent-b), #ffd66b);
      }

      .theme-space .blob.a {
        background: linear-gradient(45deg, #6b46c1, #805ad5);
      }

      .theme-space .blob.b {
        background: linear-gradient(45deg, #d53f8c, #ed64a6);
      }

      .theme-forest .blob.a {
        background: linear-gradient(45deg, #38a169, #48bb78);
      }

      .theme-forest .blob.b {
        background: linear-gradient(45deg, #2f855a, #68d391);
      }

      .theme-sunset .blob.a {
        background: linear-gradient(45deg, #dd6b20, #ed8936);
      }

      .theme-sunset .blob.b {
        background: linear-gradient(45deg, #c05621, #f6ad55);
      }

      .theme-ocean .blob.a {
        background: linear-gradient(45deg, #3182ce, #4299e1);
      }

      .theme-ocean .blob.b {
        background: linear-gradient(45deg, #2b6cb0, #63b3ed);
      }

      .title-neon {
        font-family: 'Orbitron', sans-serif;
        letter-spacing: -0.02em;
        text-transform: none;
        transition: text-shadow 0.5s ease;
      }

      .theme-cyberpunk .title-neon {
        text-shadow: 0 0 8px rgba(0, 240, 255, 0.14),
          0 0 24px rgba(255, 75, 214, 0.08);
      }

      .theme-space .title-neon {
        text-shadow: 0 0 8px rgba(107, 70, 193, 0.14),
          0 0 24px rgba(213, 63, 140, 0.08);
      }

      .theme-forest .title-neon {
        text-shadow: 0 0 8px rgba(56, 161, 105, 0.14),
          0 0 24px rgba(72, 187, 120, 0.08);
      }

      .theme-sunset .title-neon {
        text-shadow: 0 0 8px rgba(221, 107, 32, 0.14),
          0 0 24px rgba(237, 137, 54, 0.08);
      }

      .theme-ocean .title-neon {
        text-shadow: 0 0 8px rgba(49, 130, 206, 0.14),
          0 0 24px rgba(66, 153, 225, 0.08);
      }

      .glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px) saturate(1.1);
        box-shadow: 0 8px 40px rgba(3, 6, 23, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.02);
        border-radius: 14px;
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-10px) scale(1.01) rotateX(2deg);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(0, 240, 255, 0.06);
      }

      .card {
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
          box-shadow 0.35s, filter 0.35s;
      }

      .theme-space .card:hover {
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(107, 70, 193, 0.06);
      }

      .theme-forest .card:hover {
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(56, 161, 105, 0.06);
      }

      .theme-sunset .card:hover {
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(221, 107, 32, 0.06);
      }

      .theme-ocean .card:hover {
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6),
          0 0 40px rgba(49, 130, 206, 0.06);
      }

      .tilt {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .accent-line {
        height: 4px;
        border-radius: 999px;
        transition: background 0.5s ease;
      }

      .theme-cyberpunk .accent-line {
        background: linear-gradient(90deg, var(--accent-a), var(--accent-b));
      }

      .theme-space .accent-line {
        background: linear-gradient(90deg, #6b46c1, #d53f8c);
      }

      .theme-forest .accent-line {
        background: linear-gradient(90deg, #38a169, #48bb78);
      }

      .theme-sunset .accent-line {
        background: linear-gradient(90deg, #dd6b20, #ed8936);
      }

      .theme-ocean .accent-line {
        background: linear-gradient(90deg, #3182ce, #4299e1);
      }

      .search-box {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .tiny-badge {
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .pill {
        transition: transform 0.22s, box-shadow 0.22s;
      }

      .pill:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(3, 6, 23, 0.6);
      }

      .theme-btn {
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .theme-btn:hover {
        transform: scale(1.05);
      }

      .theme-btn.active {
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      }

      .theme-cyberpunk .theme-btn.active {
        border-color: var(--accent-a);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      }

      .theme-space .theme-btn.active {
        border-color: #6b46c1;
        box-shadow: 0 0 10px rgba(107, 70, 193, 0.5);
      }

      .theme-forest .theme-btn.active {
        border-color: #38a169;
        box-shadow: 0 0 10px rgba(56, 161, 105, 0.5);
      }

      .theme-sunset .theme-btn.active {
        border-color: #dd6b20;
        box-shadow: 0 0 10px rgba(221, 107, 32, 0.5);
      }

      .theme-ocean .theme-btn.active {
        border-color: #3182ce;
        box-shadow: 0 0 10px rgba(49, 130, 206, 0.5);
      }

      .category-btn {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(0, 247, 255, 0.3);
        transition: all 0.3s ease;
      }

      .category-btn.active,
      .category-btn:hover {
        background: rgba(0, 247, 255, 0.2);
        box-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
        border-color: rgba(0, 247, 255, 0.7);
      }

      .theme-space .category-btn.active,
      .theme-space .category-btn:hover {
        background: rgba(107, 70, 193, 0.2);
        box-shadow: 0 0 10px rgba(107, 70, 193, 0.5);
        border-color: rgba(107, 70, 193, 0.7);
      }

      .theme-forest .category-btn.active,
      .theme-forest .category-btn:hover {
        background: rgba(56, 161, 105, 0.2);
        box-shadow: 0 0 10px rgba(56, 161, 105, 0.5);
        border-color: rgba(56, 161, 105, 0.7);
      }

      .theme-sunset .category-btn.active,
      .theme-sunset .category-btn:hover {
        background: rgba(221, 107, 32, 0.2);
        box-shadow: 0 0 10px rgba(221, 107, 32, 0.5);
        border-color: rgba(221, 107, 32, 0.7);
      }

      .theme-ocean .category-btn.active,
      .theme-ocean .category-btn:hover {
        background: rgba(49, 130, 206, 0.2);
        box-shadow: 0 0 10px rgba(49, 130, 206, 0.5);
        border-color: rgba(49, 130, 206, 0.7);
      }

      .site-link {
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .site-link:hover {
        transform: scale(1.05);
      }

      .icon-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        margin-right: 12px;
      }

      .google-search-btn {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(66, 133, 244, 0.3);
        transition: all 0.3s ease;
      }

      .google-search-btn:hover {
        background: rgba(66, 133, 244, 0.2);
        box-shadow: 0 0 10px rgba(66, 133, 244, 0.5);
        border-color: rgba(66, 133, 244, 0.7);
      }

      /* Rating stars */
      .rating-stars {
        display: flex;
        gap: 2px;
      }

      .star {
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .star:hover {
        transform: scale(1.2);
      }

      .favorite-btn {
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .favorite-btn:hover {
        transform: scale(1.2);
      }

      .favorite-btn.active {
        color: #ef4444;
        text-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      }

      .notes-textarea {
        background: rgba(15, 23, 42, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        resize: vertical;
        min-height: 60px;
        color: #e5e7eb;
        width: 100%;
        box-sizing: border-box;
      }

      .notes-textarea:focus {
        outline: none;
        border-color: rgba(0, 240, 255, 0.5);
        box-shadow: 0 0 5px rgba(0, 240, 255, 0.3);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
        padding: 16px;
      }

      .modal-content {
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .filter-btn {
        transition: all 0.3s ease;
      }

      .filter-btn.active {
        background: rgba(0, 240, 255, 0.2);
        box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        border-color: rgba(0, 240, 255, 0.7);
      }

      .theme-space .filter-btn.active {
        background: rgba(107, 70, 193, 0.2);
        box-shadow: 0 0 10px rgba(107, 70, 193, 0.5);
        border-color: rgba(107, 70, 193, 0.7);
      }

      .theme-forest .filter-btn.active {
        background: rgba(56, 161, 105, 0.2);
        box-shadow: 0 0 10px rgba(56, 161, 105, 0.5);
        border-color: rgba(56, 161, 105, 0.7);
      }

      .theme-sunset .filter-btn.active {
        background: rgba(221, 107, 32, 0.2);
        box-shadow: 0 0 10px rgba(221, 107, 32, 0.5);
        border-color: rgba(221, 107, 32, 0.7);
      }

      .theme-ocean .filter-btn.active {
        background: rgba(49, 130, 206, 0.2);
        box-shadow: 0 0 10px rgba(49, 130, 206, 0.5);
        border-color: rgba(49, 130, 206, 0.7);
      }

      /* Category-specific colors for each theme */
      /* Cyberpunk Theme */
      .theme-cyberpunk .category-movies .icon-container {
        background: rgba(0, 240, 255, 0.15);
      }
      .theme-cyberpunk .category-tv .icon-container {
        background: rgba(255, 75, 214, 0.15);
      }
      .theme-cyberpunk .category-both .icon-container {
        background: rgba(255, 214, 107, 0.15);
      }
      .theme-cyberpunk .category-movies .category-badge {
        background: rgba(0, 240, 255, 0.2);
        border-color: rgba(0, 240, 255, 0.4);
      }
      .theme-cyberpunk .category-tv .category-badge {
        background: rgba(255, 75, 214, 0.2);
        border-color: rgba(255, 75, 214, 0.4);
      }
      .theme-cyberpunk .category-both .category-badge {
        background: rgba(255, 214, 107, 0.2);
        border-color: rgba(255, 214, 107, 0.4);
      }
      .theme-cyberpunk .category-movies .category-icon {
        color: #00f0ff;
      }
      .theme-cyberpunk .category-tv .category-icon {
        color: #ff4bd6;
      }
      .theme-cyberpunk .category-both .category-icon {
        color: #ffd66b;
      }

      /* Space Theme */
      .theme-space .category-movies .icon-container {
        background: rgba(107, 70, 193, 0.15);
      }
      .theme-space .category-tv .icon-container {
        background: rgba(213, 63, 140, 0.15);
      }
      .theme-space .category-both .icon-container {
        background: rgba(66, 153, 225, 0.15);
      }
      .theme-space .category-movies .category-badge {
        background: rgba(107, 70, 193, 0.2);
        border-color: rgba(107, 70, 193, 0.4);
      }
      .theme-space .category-tv .category-badge {
        background: rgba(213, 63, 140, 0.2);
        border-color: rgba(213, 63, 140, 0.4);
      }
      .theme-space .category-both .category-badge {
        background: rgba(66, 153, 225, 0.2);
        border-color: rgba(66, 153, 225, 0.4);
      }
      .theme-space .category-movies .category-icon {
        color: #6b46c1;
      }
      .theme-space .category-tv .category-icon {
        color: #d53f8c;
      }
      .theme-space .category-both .category-icon {
        color: #4299e1;
      }

      /* Forest Theme */
      .theme-forest .category-movies .icon-container {
        background: rgba(56, 161, 105, 0.15);
      }
      .theme-forest .category-tv .icon-container {
        background: rgba(72, 187, 120, 0.15);
      }
      .theme-forest .category-both .icon-container {
        background: rgba(154, 230, 180, 0.15);
      }
      .theme-forest .category-movies .category-badge {
        background: rgba(56, 161, 105, 0.2);
        border-color: rgba(56, 161, 105, 0.4);
      }
      .theme-forest .category-tv .category-badge {
        background: rgba(72, 187, 120, 0.2);
        border-color: rgba(72, 187, 120, 0.4);
      }
      .theme-forest .category-both .category-badge {
        background: rgba(154, 230, 180, 0.2);
        border-color: rgba(154, 230, 180, 0.4);
      }
      .theme-forest .category-movies .category-icon {
        color: #38a169;
      }
      .theme-forest .category-tv .category-icon {
        color: #48bb78;
      }
      .theme-forest .category-both .category-icon {
        color: #9ae6b4;
      }

      /* Sunset Theme */
      .theme-sunset .category-movies .icon-container {
        background: rgba(221, 107, 32, 0.15);
      }
      .theme-sunset .category-tv .icon-container {
        background: rgba(237, 137, 54, 0.15);
      }
      .theme-sunset .category-both .icon-container {
        background: rgba(246, 173, 85, 0.15);
      }
      .theme-sunset .category-movies .category-badge {
        background: rgba(221, 107, 32, 0.2);
        border-color: rgba(221, 107, 32, 0.4);
      }
      .theme-sunset .category-tv .category-badge {
        background: rgba(237, 137, 54, 0.2);
        border-color: rgba(237, 137, 54, 0.4);
      }
      .theme-sunset .category-both .category-badge {
        background: rgba(246, 173, 85, 0.2);
        border-color: rgba(246, 173, 85, 0.4);
      }
      .theme-sunset .category-movies .category-icon {
        color: #dd6b20;
      }
      .theme-sunset .category-tv .category-icon {
        color: #ed8936;
      }
      .theme-sunset .category-both .category-icon {
        color: #f6ad55;
      }

      /* Ocean Theme */
      .theme-ocean .category-movies .icon-container {
        background: rgba(49, 130, 206, 0.15);
      }
      .theme-ocean .category-tv .icon-container {
        background: rgba(66, 153, 225, 0.15);
      }
      .theme-ocean .category-both .icon-container {
        background: rgba(99, 179, 237, 0.15);
      }
      .theme-ocean .category-movies .category-badge {
        background: rgba(49, 130, 206, 0.2);
        border-color: rgba(49, 130, 206, 0.4);
      }
      .theme-ocean .category-tv .category-badge {
        background: rgba(66, 153, 225, 0.2);
        border-color: rgba(66, 153, 225, 0.4);
      }
      .theme-ocean .category-both .category-badge {
        background: rgba(99, 179, 237, 0.2);
        border-color: rgba(99, 179, 237, 0.4);
      }
      .theme-ocean .category-movies .category-icon {
        color: #3182ce;
      }
      .theme-ocean .category-tv .category-icon {
        color: #4299e1;
      }
      .theme-ocean .category-both .category-icon {
        color: #63b3ed;
      }

      /* Mobile-specific styles */
      @media (max-width: 640px) {
        body {
          padding: 12px;
        }

        .card {
          padding: 12px;
        }

        .icon-container {
          width: 36px;
          height: 36px;
          margin-right: 10px;
        }

        .notes-textarea {
          font-size: 14px;
          min-height: 70px;
        }

        .action-buttons {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          margin-top: 8px;
        }

        .action-buttons button {
          flex: 1;
          min-width: 0;
          padding: 6px 8px;
          font-size: 12px;
        }

        .modal-content {
          margin: 0 8px;
        }

        .modal-overlay {
          padding: 12px;
        }
      }

      @media (max-width: 480px) {
        .card-content {
          flex-direction: column;
        }

        .icon-container {
          align-self: flex-start;
          margin-bottom: 10px;
        }

        .card-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .card-title {
          margin-bottom: 8px;
        }

        .action-buttons {
          width: 100%;
        }

        .action-buttons button {
          flex: 1;
          min-width: 0;
        }
      }

      /* Tablet-specific styles */
      @media (min-width: 641px) and (max-width: 1024px) {
        .notes-textarea {
          font-size: 13px;
        }
      }

      /* Action buttons container */
      .action-buttons {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .action-buttons button {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Card layout improvements */
      .card-content {
        display: flex;
      }

      .card-details {
        flex: 1;
        min-width: 0; /* Prevent flex item from overflowing */
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .card-title {
        flex: 1;
        margin-right: 8px;
        word-break: break-word;
      }
    </style>
  </head>
  <body class="theme-cyberpunk">
    <!-- Decorative blobs -->
    <div class="blob a" aria-hidden></div>
    <div class="blob b" aria-hidden></div>

    <main class="max-w-6xl mx-auto">
      <!-- Header -->
      <header
        class="flex items-center justify-between gap-4 mb-6 flex-col sm:flex-row"
      >
        <div class="w-full sm:w-auto">

      // Load data from localStorage if available
      function loadData() {
        const savedData = localStorage.getItem('streamingSitesData');
        if (savedData) {
          STREAMING_SITES = JSON.parse(savedData);
        }
      }

      // Save data to localStorage
      function saveData() {
        localStorage.setItem(
          'streamingSitesData',
          JSON.stringify(STREAMING_SITES),
        );
      }

      // Icon fallback mapping for FA names that are not regular
      function faIconClass(name) {
        if (!name) return 'fa-solid fa-film';
        if (name.startsWith('fa-')) return 'fa-solid ' + name;
        return 'fa-solid ' + name;
      }

      const container = document.querySelector('#sites');

      // Generate star rating HTML
      function generateStars(rating, siteId) {
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          const isFilled = i <= rating;
          starsHtml += `<i class="fas fa-star star ${
            isFilled ? 'text-yellow-400' : 'text-gray-500'
          }" 
                          data-rating="${i}" data-site="${siteId}"></i>`;
        }
        return starsHtml;
      }

      function makeCard(item) {
        const wrap = document.createElement('article');
        wrap.className = `card glass p-3 sm:p-4 rounded-xl tilt site-link category-${item.category}`;
        wrap.setAttribute('data-name', item.name);
        wrap.setAttribute('data-id', item.id);
        wrap.innerHTML = `
            <div class="card-content">
                <div class="icon-container">
                    <i class="${faIconClass(
                      item.icon,
                    )} text-lg sm:text-xl category-icon"></i>
                </div>
                <div class="card-details">
                    <div class="card-header">
                        <h3 class="card-title font-semibold text-sm sm:text-base">${
                          item.name
                        }</h3>
                        <button class="favorite-btn ${
                          item.favorite ? 'active' : ''
                        }" data-id="${item.id}">
                            <i class="fas fa-heart ${
                              item.favorite ? 'text-red-500' : 'text-gray-500'
                            }"></i>
                        </button>
                    </div>
                    <div class="rating-stars mb-2">
                        ${generateStars(item.rating, item.id)}
                    </div>
                    <div class="text-xs tiny-badge category-badge mb-2 inline-block">${getCategoryText(
                      item.category,
                    )}</div>
                    <div class="action-buttons">
                        <button class="edit-btn tiny-badge" data-id="${
                          item.id
                        }"><i class="fas fa-edit"></i> Edit</button>
                        <button class="google-search-btn tiny-badge" data-name="${
                          item.name
                        }"><i class="fa-brands fa-google"></i> Search</button>
                        <button class="delete-btn tiny-badge" data-id="${
                          item.id
                        }"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    <div class="mt-3">
                        <textarea class="notes-textarea w-full" placeholder="Add notes..." data-id="${
                          item.id
                        }">${item.notes || ''}</textarea>
                    </div>
                </div>
            </div>
            `;

        // simple tilt mouse effect
        wrap.addEventListener('mousemove', (e) => {
          const rect = wrap.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          wrap.style.transform = `perspective(900px) rotateX(${
            -y * 6
          }deg) rotateY(${x * 6}deg) translateY(-6px)`;
        });
        wrap.addEventListener('mouseleave', () => {
          wrap.style.transform = 'translateY(0)';
        });

        return wrap;
      }

      function render(list) {
        container.innerHTML = '';
        list.forEach((it) => container.appendChild(makeCard(it)));
      }

      // Apply filters and render
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const activeCat =
          Array.from(pills).find((p) => p.classList.contains('active'))?.dataset
            .cat || 'all';
        const showFavorites = favoritesFilter.classList.contains('active');

        let filtered = STREAMING_SITES.filter((r) => {
          const matchesQ = q.length === 0 || r.name.toLowerCase().includes(q);
          const matchesCat = activeCat === 'all' || r.category === activeCat;
          const matchesFav = !showFavorites || r.favorite;
          return matchesQ && matchesCat && matchesFav;
        });

        render(filtered);
      }

      // Initialize the app
      function init() {
        loadData();
        render(STREAMING_SITES);

        // Set up event listeners
        search.addEventListener('input', applyFilters);

        pills.forEach((p) => {
          p.addEventListener('click', () => {
            pills.forEach((x) => x.classList.remove('active'));
            p.classList.add('active');
            applyFilters();
          });
        });

        favoritesFilter.addEventListener('click', () => {
          favoritesFilter.classList.toggle('active');
          applyFilters();
        });

        // Modal functionality
        addSiteBtn.addEventListener('click', () => {
          openModal();
        });

        closeModal.addEventListener('click', closeModalFunc);
        cancelBtn.addEventListener('click', closeModalFunc);

        siteForm.addEventListener('submit', (e) => {
          e.preventDefault();
          saveSite();
        });

        // Export functionality
        exportBtn.addEventListener('click', exportData);

        // Event delegation for dynamic elements
        document.body.addEventListener('click', handleBodyClick);
        document.body.addEventListener('change', handleBodyChange);
      }

      // Handle click events on dynamic elements
      function handleBodyClick(e) {
        // Favorite button
        if (e.target.closest('.favorite-btn')) {
          const btn = e.target.closest('.favorite-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          toggleFavorite(siteId);
        }

        // Star rating
        if (e.target.classList.contains('star')) {
          const rating = parseInt(e.target.getAttribute('data-rating'));
          const siteId = parseInt(e.target.getAttribute('data-site'));
          setRating(siteId, rating);
        }

        // Edit button
        if (e.target.closest('.edit-btn')) {
          const btn = e.target.closest('.edit-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          openModal(siteId);
        }

        // Delete button
        if (e.target.closest('.delete-btn')) {
          const btn = e.target.closest('.delete-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          deleteSite(siteId);
        }

        // Google search button
        const s = e.target.closest('.google-search-btn');
        if (s) {
          e.stopPropagation();
          const siteName = s.getAttribute('data-name');
          searchOnGoogle(siteName);
        }

        // Site card click
        const card = e.target.closest('.site-link');
        if (
          card &&
          !e.target.closest('button') &&
          !e.target.closest('textarea')
        ) {
          const siteName = card.getAttribute('data-name');
          searchOnGoogle(siteName);
        }
      }

      // Handle change events on dynamic elements
      function handleBodyChange(e) {
        // Notes textarea
        if (e.target.classList.contains('notes-textarea')) {
          const siteId = parseInt(e.target.getAttribute('data-id'));
          const notes = e.target.value;
          updateNotes(siteId, notes);
        }
      }

      // Toggle favorite status
      function toggleFavorite(siteId) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.favorite = !site.favorite;
          saveData();
          applyFilters();
        }
      }

      // Set rating for a site
      function setRating(siteId, rating) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.rating = rating;
          saveData();
          applyFilters();
        }
      }

      // Update notes for a site
      function updateNotes(siteId, notes) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.notes = notes;
          saveData();
        }
      }

      // Open modal for adding/editing a site
      function openModal(siteId = null) {
        const modal = document.getElementById('siteModal');
        const title = document.getElementById('modalTitle');
        const form = document.getElementById('siteForm');

        if (siteId) {
          // Edit mode
          title.textContent = 'Edit Site';
          const site = STREAMING_SITES.find((s) => s.id === siteId);
          if (site) {
            document.getElementById('siteName').value = site.name;
            document.getElementById('siteUrl').value = site.url || '';
            document.getElementById('siteIcon').value = site.icon;

            // Set the radio button
            const radio = document.querySelector(
              `input[name="siteType"][value="${site.category}"]`,
            );
            if (radio) radio.checked = true;

            // Store the site ID for updating
            form.setAttribute('data-edit-id', siteId);
          }
        } else {
          // Add mode
          title.textContent = 'Add New Site';
          form.reset();
          document.getElementById('siteIcon').value = 'fa-film';
          form.removeAttribute('data-edit-id');
        }

        modal.classList.remove('hidden');
      }

      // Close modal
      function closeModalFunc() {
        document.getElementById('siteModal').classList.add('hidden');
      }

      // Save site (add or update)
      function saveSite() {
        const form = document.getElementById('siteForm');
        const name = document.getElementById('siteName').value.trim();
        const url = document.getElementById('siteUrl').value.trim();
        const type = document.querySelector(
          'input[name="siteType"]:checked',
        ).value;
        const icon = document.getElementById('siteIcon').value.trim();

        if (!name) return;

        const editId = form.getAttribute('data-edit-id');

        if (editId) {
          // Update existing site
          const site = STREAMING_SITES.find((s) => s.id === parseInt(editId));
          if (site) {
            site.name = name;
            site.url = url;
            site.category = type;
            site.icon = icon;
          }
        } else {
          // Add new site
          const newId = Math.max(...STREAMING_SITES.map((s) => s.id)) + 1;
          STREAMING_SITES.push({
            id: newId,
            name,
            url,
            category: type,
            icon,
            rating: 0,
            favorite: false,
            notes: '',
          });
        }

        saveData();
        applyFilters();
        closeModalFunc();
      }

      // Delete a site
      function deleteSite(siteId) {
        if (confirm('Are you sure you want to delete this site?')) {
          STREAMING_SITES = STREAMING_SITES.filter((s) => s.id !== siteId);
          saveData();
          applyFilters();
        }
      }

      // Export data as JSON
      function exportData() {
        const dataStr = JSON.stringify(STREAMING_SITES, null, 2);
        const dataUri =
          'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

        const exportFileDefaultName = 'streaming-sites-data.json';

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
      }

      // Function to open Google search
      function searchOnGoogle(siteName) {
        const query = encodeURIComponent(siteName + ' streaming site');
        window.open(`https://www.google.com/search?q=${query}`, '_blank');
      }

      // Helper functions for categories
      function getCategoryText(category) {
        switch (category) {
          case 'movies':
            return 'Movies';
          case 'tv':
            return 'TV Series';
          case 'both':
            return 'Movies & TV';
          default:
            return 'Unknown';
        }
      }

      // Theme switching functionality
      const themeButtons = document.querySelectorAll('.theme-btn');

      themeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const theme = button.getAttribute('data-theme');

          // Update active button
          themeButtons.forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');

          // Update body class
          document.body.className = `theme-${theme}`;
        });
      });

      // DOM elements
      const search = document.querySelector('#search');
      const pills = document.querySelectorAll('[data-cat]');
      const favoritesFilter = document.getElementById('favoritesFilter');
      const addSiteBtn = document.getElementById('addSiteBtn');
      const closeModal = document.getElementById('closeModal');
      const cancelBtn = document.getElementById('cancelBtn');
      const siteForm = document.getElementById('siteForm');
      const exportBtn = document.getElementById('exportBtn');
      const clear = document.getElementById('clearSearch');

      // small UX: clear button show/hide
      search.addEventListener('input', () => {
        clear.classList.toggle('hidden', search.value.trim().length === 0);
      });
      clear.addEventListener('click', () => {
        search.value = '';
        applyFilters();
        clear.classList.add('hidden');
        search.focus();
      });

      // Initialize the app when DOM is loaded
      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
