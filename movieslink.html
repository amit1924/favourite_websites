<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streaming Sites Directory - Enhanced with Ratings & Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Orbitron:wght@600;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --purple: #8b5cf6;
        --blue: #3b82f6;
        --teal: #14b8a6;
        --pink: #ec4899;
        --amber: #f59e0b;
        --emerald: #10b981;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: #94a3b8;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        padding: 16px;
        min-height: 100vh;
        background: linear-gradient(145deg, #0c0c14, #12121f, #0e0e1a);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.5);
      }

      h1, h2, h3, h4, h5, h6 {
        color: #f1f5f9;
      }

      .title-neon {
        font-family: 'Orbitron', sans-serif;
        letter-spacing: -0.02em;
        text-transform: none;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .glass {
        background: rgba(22, 22, 36, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 14px;
        transition: all 0.3s ease;
      }

      .card {
        position: relative;
        background: rgba(22, 22, 36, 0.6);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 14px;
        transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.3, 1),
          border-color 0.35s, box-shadow 0.35s;
        overflow: hidden;
        animation: fadeUp 0.6s ease-out forwards;
        opacity: 0;
      }

      .card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 3px;
        height: 100%;
        background: linear-gradient(180deg, var(--purple), var(--blue), var(--teal));
        border-radius: 3px 0 0 3px;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.07);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }

      .card:nth-child(1) { animation-delay: 0.05s; }
      .card:nth-child(2) { animation-delay: 0.1s; }
      .card:nth-child(3) { animation-delay: 0.15s; }
      .card:nth-child(4) { animation-delay: 0.2s; }
      .card:nth-child(5) { animation-delay: 0.25s; }
      .card:nth-child(6) { animation-delay: 0.3s; }
      .card:nth-child(7) { animation-delay: 0.35s; }
      .card:nth-child(8) { animation-delay: 0.4s; }
      .card:nth-child(9) { animation-delay: 0.45s; }
      .card:nth-child(10) { animation-delay: 0.5s; }

      .tilt {
        transform-style: preserve-3d;
        will-change: transform;
      }

      .accent-line {
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--purple), var(--blue));
      }

      .theme-space .accent-line {
        background: linear-gradient(90deg, var(--blue), var(--teal));
      }
      .theme-forest .accent-line {
        background: linear-gradient(90deg, var(--emerald), var(--teal));
      }
      .theme-sunset .accent-line {
        background: linear-gradient(90deg, var(--amber), var(--pink));
      }
      .theme-ocean .accent-line {
        background: linear-gradient(90deg, var(--teal), var(--blue));
      }

      .blob {
        position: fixed;
        filter: blur(60px);
        opacity: 0.5;
        pointer-events: none;
        transition: all 0.5s ease;
      }

      .blob.a {
        left: 6%;
        top: 10%;
        width: 360px;
        height: 360px;
      }

      .blob.b {
        right: 6%;
        bottom: 8%;
        width: 420px;
        height: 420px;
      }

      .theme-cyberpunk .blob.a { background: linear-gradient(45deg, var(--purple), var(--pink)); }
      .theme-cyberpunk .blob.b { background: linear-gradient(45deg, var(--pink), var(--amber)); }
      .theme-space .blob.a { background: linear-gradient(45deg, var(--blue), var(--purple)); }
      .theme-space .blob.b { background: linear-gradient(45deg, var(--pink), var(--teal)); }
      .theme-forest .blob.a { background: linear-gradient(45deg, var(--emerald), var(--purple)); }
      .theme-forest .blob.b { background: linear-gradient(45deg, var(--emerald), var(--amber)); }
      .theme-sunset .blob.a { background: linear-gradient(45deg, var(--amber), var(--pink)); }
      .theme-sunset .blob.b { background: linear-gradient(45deg, var(--amber), var(--blue)); }
      .theme-ocean .blob.a { background: linear-gradient(45deg, var(--teal), var(--blue)); }
      .theme-ocean .blob.b { background: linear-gradient(45deg, var(--purple), var(--teal)); }

      .search-box {
        background: rgba(15, 15, 25, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #f1f5f9;
        border-radius: 8px;
      }

      .search-box:focus {
        outline: none;
        border-color: rgba(139, 92, 246, 0.4);
      }

      .tiny-badge {
        font-size: 11px;
        padding: 6px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        color: #94a3b8;
      }

      .pill {
        transition: transform 0.22s;
      }

      .pill:hover {
        transform: translateY(-4px);
      }

      .theme-btn {
        transition: all 0.3s ease;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.03);
        color: #94a3b8;
      }

      .theme-btn:hover {
        transform: scale(1.05);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .theme-btn.active {
        border: 2px solid rgba(255, 255, 255, 0.5);
      }

      .theme-cyberpunk .theme-btn.active { border-color: var(--purple); }
      .theme-space .theme-btn.active { border-color: var(--blue); }
      .theme-forest .theme-btn.active { border-color: var(--emerald); }
      .theme-sunset .theme-btn.active { border-color: var(--amber); }
      .theme-ocean .theme-btn.active { border-color: var(--teal); }

      .category-btn {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.06);
        transition: all 0.3s ease;
        color: #94a3b8;
      }

      .category-btn.active,
      .category-btn:hover {
        background: rgba(139, 92, 246, 0.15);
        border-color: rgba(139, 92, 246, 0.3);
      }

      .theme-space .category-btn.active,
      .theme-space .category-btn:hover {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
      }

      .theme-forest .category-btn.active,
      .theme-forest .category-btn:hover {
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.3);
      }

      .theme-sunset .category-btn.active,
      .theme-sunset .category-btn:hover {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.3);
      }

      .theme-ocean .category-btn.active,
      .theme-ocean .category-btn:hover {
        background: rgba(20, 184, 166, 0.15);
        border-color: rgba(20, 184, 166, 0.3);
      }

      .site-link {
        transition: all 0.3s ease;
        cursor: pointer;
      }

      .site-link:hover {
        transform: scale(1.02);
      }

      .icon-container {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        margin-right: 12px;
        background: rgba(255, 255, 255, 0.03);
      }

      .google-search-btn {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(59, 130, 246, 0.25);
        transition: all 0.3s ease;
        color: #94a3b8;
      }

      .google-search-btn:hover {
        background: rgba(59, 130, 246, 0.12);
        border-color: rgba(59, 130, 246, 0.4);
      }

      .rating-stars {
        display: flex;
        gap: 2px;
      }

      .star {
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .star:hover {
        transform: scale(1.2);
      }

      .favorite-btn {
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .favorite-btn:hover {
        transform: scale(1.2);
      }

      .favorite-btn.active {
        color: #ef4444;
      }

      .notes-textarea {
        background: rgba(15, 23, 42, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
        resize: vertical;
        min-height: 60px;
        color: #f1f5f9;
        width: 100%;
        box-sizing: border-box;
      }

      .notes-textarea:focus {
        outline: none;
        border-color: rgba(139, 92, 246, 0.3);
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        backdrop-filter: blur(4px);
        padding: 16px;
      }

      .modal-content {
        width: 100%;
        max-width: 500px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .filter-btn {
        transition: all 0.3s ease;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #94a3b8;
      }

      .filter-btn.active {
        background: rgba(139, 92, 246, 0.15);
        border-color: rgba(139, 92, 246, 0.3);
      }

      .theme-space .filter-btn.active {
        background: rgba(59, 130, 246, 0.15);
        border-color: rgba(59, 130, 246, 0.3);
      }

      .theme-forest .filter-btn.active {
        background: rgba(16, 185, 129, 0.15);
        border-color: rgba(16, 185, 129, 0.3);
      }

      .theme-sunset .filter-btn.active {
        background: rgba(245, 158, 11, 0.15);
        border-color: rgba(245, 158, 11, 0.3);
      }

      .theme-ocean .filter-btn.active {
        background: rgba(20, 184, 166, 0.15);
        border-color: rgba(20, 184, 166, 0.3);
      }

      /* Category-specific colors for each theme */

      .theme-cyberpunk .category-movies .icon-container { background: rgba(139, 92, 246, 0.12); }
      .theme-cyberpunk .category-tv .icon-container { background: rgba(236, 72, 153, 0.12); }
      .theme-cyberpunk .category-both .icon-container { background: rgba(245, 158, 11, 0.12); }
      .theme-cyberpunk .category-movies .category-badge { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.25); }
      .theme-cyberpunk .category-tv .category-badge { background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.25); }
      .theme-cyberpunk .category-both .category-badge { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.25); }
      .theme-cyberpunk .category-movies .category-icon { color: var(--purple); }
      .theme-cyberpunk .category-tv .category-icon { color: var(--pink); }
      .theme-cyberpunk .category-both .category-icon { color: var(--amber); }

      .theme-space .category-movies .icon-container { background: rgba(59, 130, 246, 0.12); }
      .theme-space .category-tv .icon-container { background: rgba(236, 72, 153, 0.12); }
      .theme-space .category-both .icon-container { background: rgba(20, 184, 166, 0.12); }
      .theme-space .category-movies .category-badge { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.25); }
      .theme-space .category-tv .category-badge { background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.25); }
      .theme-space .category-both .category-badge { background: rgba(20, 184, 166, 0.15); border-color: rgba(20, 184, 166, 0.25); }
      .theme-space .category-movies .category-icon { color: var(--blue); }
      .theme-space .category-tv .category-icon { color: var(--pink); }
      .theme-space .category-both .category-icon { color: var(--teal); }

      .theme-forest .category-movies .icon-container { background: rgba(16, 185, 129, 0.12); }
      .theme-forest .category-tv .icon-container { background: rgba(139, 92, 246, 0.12); }
      .theme-forest .category-both .icon-container { background: rgba(245, 158, 11, 0.12); }
      .theme-forest .category-movies .category-badge { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.25); }
      .theme-forest .category-tv .category-badge { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.25); }
      .theme-forest .category-both .category-badge { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.25); }
      .theme-forest .category-movies .category-icon { color: var(--emerald); }
      .theme-forest .category-tv .category-icon { color: var(--purple); }
      .theme-forest .category-both .category-icon { color: var(--amber); }

      .theme-sunset .category-movies .icon-container { background: rgba(245, 158, 11, 0.12); }
      .theme-sunset .category-tv .icon-container { background: rgba(236, 72, 153, 0.12); }
      .theme-sunset .category-both .icon-container { background: rgba(59, 130, 246, 0.12); }
      .theme-sunset .category-movies .category-badge { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.25); }
      .theme-sunset .category-tv .category-badge { background: rgba(236, 72, 153, 0.15); border-color: rgba(236, 72, 153, 0.25); }
      .theme-sunset .category-both .category-badge { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.25); }
      .theme-sunset .category-movies .category-icon { color: var(--amber); }
      .theme-sunset .category-tv .category-icon { color: var(--pink); }
      .theme-sunset .category-both .category-icon { color: var(--blue); }

      .theme-ocean .category-movies .icon-container { background: rgba(20, 184, 166, 0.12); }
      .theme-ocean .category-tv .icon-container { background: rgba(59, 130, 246, 0.12); }
      .theme-ocean .category-both .icon-container { background: rgba(139, 92, 246, 0.12); }
      .theme-ocean .category-movies .category-badge { background: rgba(20, 184, 166, 0.15); border-color: rgba(20, 184, 166, 0.25); }
      .theme-ocean .category-tv .category-badge { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.25); }
      .theme-ocean .category-both .category-badge { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.25); }
      .theme-ocean .category-movies .category-icon { color: var(--teal); }
      .theme-ocean .category-tv .category-icon { color: var(--blue); }
      .theme-ocean .category-both .category-icon { color: var(--purple); }

      @media (max-width: 640px) {
        body { padding: 12px; }
        .card { padding: 12px; }
        .icon-container { width: 36px; height: 36px; margin-right: 10px; }
        .notes-textarea { font-size: 14px; min-height: 70px; }
        .action-buttons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .action-buttons button { flex: 1; min-width: 0; padding: 6px 8px; font-size: 12px; }
        .modal-content { margin: 0 8px; }
        .modal-overlay { padding: 12px; }
      }

      @media (max-width: 480px) {
        .card-content { flex-direction: column; }
        .icon-container { align-self: flex-start; margin-bottom: 10px; }
        .card-header { flex-direction: column; align-items: flex-start; }
        .card-title { margin-bottom: 8px; }
        .action-buttons { width: 100%; }
        .action-buttons button { flex: 1; min-width: 0; }
      }

      @media (min-width: 641px) and (max-width: 1024px) {
        .notes-textarea { font-size: 13px; }
      }

      .action-buttons {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .action-buttons button {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .card-content {
        display: flex;
      }

      .card-details {
        flex: 1;
        min-width: 0;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .card-title {
        flex: 1;
        margin-right: 8px;
        word-break: break-word;
      }

      /* Preserved class hooks */
      .hero-section {}
      .top-picks-section {}
      .pick-card {}
      .free-badge {}
      .category-header {}
      .modal-header {}
      .modal-body {}
      .search-input {}
    </style>
  </head>
  <body class="theme-cyberpunk">
    <!-- Decorative blobs -->
    <div class="blob a" aria-hidden></div>
    <div class="blob b" aria-hidden></div>

    <main class="max-w-6xl mx-auto">
      <!-- Header -->
      <header
        class="flex items-center justify-between gap-4 mb-6 flex-col sm:flex-row"
      >
        <div class="w-full sm:w-auto">
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center glass"
            >
              <i class="fas fa-film text-xl sm:text-2xl theme-icon"></i>
            </div>
            <div class="flex-1 min-w-0">
              <h1 class="text-2xl sm:text-3xl md:text-4xl title-neon truncate">
                Streaming Sites Directory
              </h1>
              <p class="text-xs sm:text-sm mt-1 text-slate-300">
                Track, rate, and manage your favorite streaming sites
              </p>
            </div>
          </div>
        </div>

        <!-- Desktop Theme Selector -->
        <div class="hidden sm:flex items-center gap-3 mt-4 sm:mt-0">
          <div class="flex gap-2 flex-wrap justify-center">
            <button
              class="theme-btn tiny-badge flex items-center gap-2 active"
              data-theme="cyberpunk"
            >
              <i class="fas fa-robot"></i> Cyber
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="space"
            >
              <i class="fas fa-meteor"></i> Space
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="forest"
            >
              <i class="fas fa-tree"></i> Forest
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="sunset"
            >
              <i class="fas fa-sun"></i> Sunset
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="ocean"
            >
              <i class="fas fa-water"></i> Ocean
            </button>
          </div>
        </div>
      </header>

      <!-- Mobile Theme Selector -->
      <div class="sm:hidden mb-6">
        <div class="glass p-4 rounded-xl">
          <h3 class="text-sm font-semibold mb-2 text-center">Choose Theme:</h3>
          <div class="flex flex-wrap justify-center gap-2">
            <button
              class="theme-btn tiny-badge flex items-center gap-2 active"
              data-theme="cyberpunk"
            >
              <i class="fas fa-robot"></i> Cyber
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="space"
            >
              <i class="fas fa-meteor"></i> Space
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="forest"
            >
              <i class="fas fa-tree"></i> Forest
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="sunset"
            >
              <i class="fas fa-sun"></i> Sunset
            </button>
            <button
              class="theme-btn tiny-badge flex items-center gap-2"
              data-theme="ocean"
            >
              <i class="fas fa-water"></i> Ocean
            </button>
          </div>
        </div>
      </div>

      <!-- Hero / Controls -->
      <section class="glass p-4 sm:p-6 rounded-xl mb-6">
        <div
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <div class="flex-1 min-w-0">
            <h2 class="text-lg sm:text-xl font-semibold">
              Manage your streaming sites ✨
            </h2>
            <p class="text-xs sm:text-sm text-slate-300 mt-1">
              Add custom sites, rate them, mark favorites, and add personal
              notes.
            </p>

            <div class="mt-4 flex gap-3 flex-col sm:flex-row">
              <div class="relative flex-1">
                <input
                  id="search"
                  class="w-full rounded-lg py-2 sm:py-3 px-3 sm:px-4 search-box text-sm placeholder:text-slate-400 outline-none"
                  placeholder="Search for a streaming site..."
                />
                <button
                  id="clearSearch"
                  class="absolute right-2 top-2 hidden p-1 sm:p-2 rounded-md tiny-badge"
                >
                  <i class="fa-solid fa-xmark text-xs"></i>
                </button>
              </div>
              <button
                id="addSiteBtn"
                class="glass px-4 py-2 rounded-lg text-sm flex items-center gap-2 justify-center"
              >
                <i class="fas fa-plus"></i> Add Site
              </button>
            </div>
          </div>

          <div class="w-full md:w-64">
            <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
              <button
                data-cat="all"
                class="category-btn px-3 py-2 rounded-lg text-sm active"
                aria-pressed="true"
              >
                All Sites
              </button>
              <button

      // Load data from localStorage if available
      function loadData() {
        const savedData = localStorage.getItem('streamingSitesData');
        if (savedData) {
          STREAMING_SITES = JSON.parse(savedData);
        }
      }

      // Save data to localStorage
      function saveData() {
        localStorage.setItem(
          'streamingSitesData',
          JSON.stringify(STREAMING_SITES),
        );
      }

      // Icon fallback mapping for FA names that are not regular
      function faIconClass(name) {
        if (!name) return 'fa-solid fa-film';
        if (name.startsWith('fa-')) return 'fa-solid ' + name;
        return 'fa-solid ' + name;
      }

      const container = document.querySelector('#sites');

      // Generate star rating HTML
      function generateStars(rating, siteId) {
        let starsHtml = '';
        for (let i = 1; i <= 5; i++) {
          const isFilled = i <= rating;
          starsHtml += `<i class="fas fa-star star ${
            isFilled ? 'text-yellow-400' : 'text-gray-500'
          }" 
                          data-rating="${i}" data-site="${siteId}"></i>`;
        }
        return starsHtml;
      }

      function makeCard(item) {
        const wrap = document.createElement('article');
        wrap.className = `card glass p-3 sm:p-4 rounded-xl tilt site-link category-${item.category}`;
        wrap.setAttribute('data-name', item.name);
        wrap.setAttribute('data-id', item.id);
        wrap.innerHTML = `
            <div class="card-content">
                <div class="icon-container">
                    <i class="${faIconClass(
                      item.icon,
                    )} text-lg sm:text-xl category-icon"></i>
                </div>
                <div class="card-details">
                    <div class="card-header">
                        <h3 class="card-title font-semibold text-sm sm:text-base">${
                          item.name
                        }</h3>
                        <button class="favorite-btn ${
                          item.favorite ? 'active' : ''
                        }" data-id="${item.id}">
                            <i class="fas fa-heart ${
                              item.favorite ? 'text-red-500' : 'text-gray-500'
                            }"></i>
                        </button>
                    </div>
                    <div class="rating-stars mb-2">
                        ${generateStars(item.rating, item.id)}
                    </div>
                    <div class="text-xs tiny-badge category-badge mb-2 inline-block">${getCategoryText(
                      item.category,
                    )}</div>
                    <div class="action-buttons">
                        <button class="edit-btn tiny-badge" data-id="${
                          item.id
                        }"><i class="fas fa-edit"></i> Edit</button>
                        <button class="google-search-btn tiny-badge" data-name="${
                          item.name
                        }"><i class="fa-brands fa-google"></i> Search</button>
                        <button class="delete-btn tiny-badge" data-id="${
                          item.id
                        }"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    <div class="mt-3">
                        <textarea class="notes-textarea w-full" placeholder="Add notes..." data-id="${
                          item.id
                        }">${item.notes || ''}</textarea>
                    </div>
                </div>
            </div>
            `;

        // simple tilt mouse effect
        wrap.addEventListener('mousemove', (e) => {
          const rect = wrap.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          wrap.style.transform = `perspective(900px) rotateX(${
            -y * 6
          }deg) rotateY(${x * 6}deg) translateY(-6px)`;
        });
        wrap.addEventListener('mouseleave', () => {
          wrap.style.transform = 'translateY(0)';
        });

        return wrap;
      }

      function render(list) {
        container.innerHTML = '';
        list.forEach((it) => container.appendChild(makeCard(it)));
      }

      // Apply filters and render
      function applyFilters() {
        const q = search.value.trim().toLowerCase();
        const activeCat =
          Array.from(pills).find((p) => p.classList.contains('active'))?.dataset
            .cat || 'all';
        const showFavorites = favoritesFilter.classList.contains('active');

        let filtered = STREAMING_SITES.filter((r) => {
          const matchesQ = q.length === 0 || r.name.toLowerCase().includes(q);
          const matchesCat = activeCat === 'all' || r.category === activeCat;
          const matchesFav = !showFavorites || r.favorite;
          return matchesQ && matchesCat && matchesFav;
        });

        render(filtered);
      }

      // Initialize the app
      function init() {
        loadData();
        render(STREAMING_SITES);

        // Set up event listeners
        search.addEventListener('input', applyFilters);

        pills.forEach((p) => {
          p.addEventListener('click', () => {
            pills.forEach((x) => x.classList.remove('active'));
            p.classList.add('active');
            applyFilters();
          });
        });

        favoritesFilter.addEventListener('click', () => {
          favoritesFilter.classList.toggle('active');
          applyFilters();
        });

        // Modal functionality
        addSiteBtn.addEventListener('click', () => {
          openModal();
        });

        closeModal.addEventListener('click', closeModalFunc);
        cancelBtn.addEventListener('click', closeModalFunc);

        siteForm.addEventListener('submit', (e) => {
          e.preventDefault();
          saveSite();
        });

        // Export functionality
        exportBtn.addEventListener('click', exportData);

        // Event delegation for dynamic elements
        document.body.addEventListener('click', handleBodyClick);
        document.body.addEventListener('change', handleBodyChange);
      }

      // Handle click events on dynamic elements
      function handleBodyClick(e) {
        // Favorite button
        if (e.target.closest('.favorite-btn')) {
          const btn = e.target.closest('.favorite-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          toggleFavorite(siteId);
        }

        // Star rating
        if (e.target.classList.contains('star')) {
          const rating = parseInt(e.target.getAttribute('data-rating'));
          const siteId = parseInt(e.target.getAttribute('data-site'));
          setRating(siteId, rating);
        }

        // Edit button
        if (e.target.closest('.edit-btn')) {
          const btn = e.target.closest('.edit-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          openModal(siteId);
        }

        // Delete button
        if (e.target.closest('.delete-btn')) {
          const btn = e.target.closest('.delete-btn');
          const siteId = parseInt(btn.getAttribute('data-id'));
          deleteSite(siteId);
        }

        // Google search button
        const s = e.target.closest('.google-search-btn');
        if (s) {
          e.stopPropagation();
          const siteName = s.getAttribute('data-name');
          searchOnGoogle(siteName);
        }

        // Site card click
        const card = e.target.closest('.site-link');
        if (
          card &&
          !e.target.closest('button') &&
          !e.target.closest('textarea')
        ) {
          const siteName = card.getAttribute('data-name');
          searchOnGoogle(siteName);
        }
      }

      // Handle change events on dynamic elements
      function handleBodyChange(e) {
        // Notes textarea
        if (e.target.classList.contains('notes-textarea')) {
          const siteId = parseInt(e.target.getAttribute('data-id'));
          const notes = e.target.value;
          updateNotes(siteId, notes);
        }
      }

      // Toggle favorite status
      function toggleFavorite(siteId) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.favorite = !site.favorite;
          saveData();
          applyFilters();
        }
      }

      // Set rating for a site
      function setRating(siteId, rating) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.rating = rating;
          saveData();
          applyFilters();
        }
      }

      // Update notes for a site
      function updateNotes(siteId, notes) {
        const site = STREAMING_SITES.find((s) => s.id === siteId);
        if (site) {
          site.notes = notes;
          saveData();
        }
      }

      // Open modal for adding/editing a site
      function openModal(siteId = null) {
        const modal = document.getElementById('siteModal');
        const title = document.getElementById('modalTitle');
        const form = document.getElementById('siteForm');

        if (siteId) {
          // Edit mode
          title.textContent = 'Edit Site';
          const site = STREAMING_SITES.find((s) => s.id === siteId);
          if (site) {
            document.getElementById('siteName').value = site.name;
            document.getElementById('siteUrl').value = site.url || '';
            document.getElementById('siteIcon').value = site.icon;

            // Set the radio button
            const radio = document.querySelector(
              `input[name="siteType"][value="${site.category}"]`,
            );
            if (radio) radio.checked = true;

            // Store the site ID for updating
            form.setAttribute('data-edit-id', siteId);
          }
        } else {
          // Add mode
          title.textContent = 'Add New Site';
          form.reset();
          document.getElementById('siteIcon').value = 'fa-film';
          form.removeAttribute('data-edit-id');
        }

        modal.classList.remove('hidden');
      }

      // Close modal
      function closeModalFunc() {
        document.getElementById('siteModal').classList.add('hidden');
      }

      // Save site (add or update)
      function saveSite() {
        const form = document.getElementById('siteForm');
        const name = document.getElementById('siteName').value.trim();
        const url = document.getElementById('siteUrl').value.trim();
        const type = document.querySelector(
          'input[name="siteType"]:checked',
        ).value;
        const icon = document.getElementById('siteIcon').value.trim();

        if (!name) return;

        const editId = form.getAttribute('data-edit-id');

        if (editId) {
          // Update existing site
          const site = STREAMING_SITES.find((s) => s.id === parseInt(editId));
          if (site) {
            site.name = name;
            site.url = url;
            site.category = type;
            site.icon = icon;
          }
        } else {
          // Add new site
          const newId = Math.max(...STREAMING_SITES.map((s) => s.id)) + 1;
          STREAMING_SITES.push({
            id: newId,
            name,
            url,
            category: type,
            icon,
            rating: 0,
            favorite: false,
            notes: '',
          });
        }

        saveData();
        applyFilters();
        closeModalFunc();
      }

      // Delete a site
      function deleteSite(siteId) {
        if (confirm('Are you sure you want to delete this site?')) {
          STREAMING_SITES = STREAMING_SITES.filter((s) => s.id !== siteId);
          saveData();
          applyFilters();
        }
      }

      // Export data as JSON
      function exportData() {
        const dataStr = JSON.stringify(STREAMING_SITES, null, 2);
        const dataUri =
          'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);

        const exportFileDefaultName = 'streaming-sites-data.json';

        const linkElement = document.createElement('a');
        linkElement.setAttribute('href', dataUri);
        linkElement.setAttribute('download', exportFileDefaultName);
        linkElement.click();
      }

      // Function to open Google search
      function searchOnGoogle(siteName) {
        const query = encodeURIComponent(siteName + ' streaming site');
        window.open(`https://www.google.com/search?q=${query}`, '_blank');
      }

      // Helper functions for categories
      function getCategoryText(category) {
        switch (category) {
          case 'movies':
            return 'Movies';
          case 'tv':
            return 'TV Series';
          case 'both':
            return 'Movies & TV';
          default:
            return 'Unknown';
        }
      }

      // Theme switching functionality
      const themeButtons = document.querySelectorAll('.theme-btn');

      themeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const theme = button.getAttribute('data-theme');

          // Update active button
          themeButtons.forEach((btn) => btn.classList.remove('active'));
          button.classList.add('active');

          // Update body class
          document.body.className = `theme-${theme}`;
        });
      });

      // DOM elements
      const search = document.querySelector('#search');
      const pills = document.querySelectorAll('[data-cat]');
      const favoritesFilter = document.getElementById('favoritesFilter');
      const addSiteBtn = document.getElementById('addSiteBtn');
      const closeModal = document.getElementById('closeModal');
      const cancelBtn = document.getElementById('cancelBtn');
      const siteForm = document.getElementById('siteForm');
      const exportBtn = document.getElementById('exportBtn');
      const clear = document.getElementById('clearSearch');

      // small UX: clear button show/hide
      search.addEventListener('input', () => {
        clear.classList.toggle('hidden', search.value.trim().length === 0);
      });
      clear.addEventListener('click', () => {
        search.value = '';
        applyFilters();
        clear.classList.add('hidden');
        search.focus();
      });

      // Initialize the app when DOM is loaded
      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
