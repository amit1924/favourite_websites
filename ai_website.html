<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        *::-webkit-scrollbar { width: 8px; }
        *::-webkit-scrollbar-track { background: #0c0c14; }
        *::-webkit-scrollbar-thumb { background: #2c2c44; border-radius: 4px; }
        *::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(145deg, #0c0c14, #12121f, #0e0e1a);
            color: #e2e8f0;
            min-height: 100vh;
        }

        h1, h2 {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .neon-text {
            color: #e2e8f0;
            text-shadow: none;
        }

        .gradient-border {
            position: relative;
            background: transparent;
            padding: 0;
            border-radius: 14px;
            animation: fadeUp 0.6s ease forwards;
            opacity: 0;
        }

        .gradient-border::before {
            display: none;
        }

        .gradient-border:nth-child(1) { animation-delay: 0.05s; }
        .gradient-border:nth-child(2) { animation-delay: 0.10s; }
        .gradient-border:nth-child(3) { animation-delay: 0.15s; }
        .gradient-border:nth-child(4) { animation-delay: 0.20s; }
        .gradient-border:nth-child(5) { animation-delay: 0.25s; }
        .gradient-border:nth-child(6) { animation-delay: 0.30s; }
        .gradient-border:nth-child(7) { animation-delay: 0.35s; }
        .gradient-border:nth-child(8) { animation-delay: 0.40s; }

        .neon-card, .card {
            background: rgba(22,22,36,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .neon-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 14px 14px 0 0;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6, #14b8a6, #ec4899, #f59e0b);
        }

        .neon-card:hover, .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .glass {
            background: rgba(22,22,36,0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
        }

        .tilt {
            transition: transform 0.3s ease;
        }

        .site-link {
            transition: all 0.3s ease;
        }

        .site-link:hover {
            transform: scale(1.03);
        }

        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(139,92,246,0.12);
            margin-right: 12px;
        }

        .url-text {
            font-size: 0.75rem;
            color: #94a3b8;
            word-break: break-all;
        }

        .search-input {
            background: rgba(22,22,36,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-radius: 10px;
        }

        .search-input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139,92,246,0.2);
            outline: none;
        }

        .category-btn {
            background: rgba(22,22,36,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #cbd5e1;
            transition: all 0.3s ease;
            border-radius: 10px;
        }

        .category-btn.active, .category-btn:hover {
            background: rgba(139,92,246,0.15);
            border-color: #8b5cf6;
            color: #e2e8f0;
        }

        .fav-btn {
            background: rgba(22,22,36,0.6);
            border: 1px solid rgba(255,255,255,0.06);
            color: #cbd5e1;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .fav-btn:hover {
            border-color: #ec4899;
            color: #ec4899;
        }

        .free-badge {
            background: rgba(20,184,166,0.15);
            color: #14b8a6;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .notes-textarea {
            background: rgba(22,22,36,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            color: #e2e8f0;
            border-radius: 10px;
            resize: vertical;
        }

        .notes-textarea:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139,92,246,0.2);
            outline: none;
        }

        .star-rating {
            display: inline-flex;
            gap: 2px;
        }

        .star-btn {
            background: none;
            border: none;
            color: #475569;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .star-btn.active, .star-btn:hover {
            color: #f59e0b;
        }

        .category-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(139,92,246,0.12);
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-bold neon-text mb-4">AI Tools Directory</h1>
            <p class="text-lg text-cyan-200 max-w-2xl mx-auto">Create funny realistic celebrity videos instantly with these AI tools</p>
            
            <!-- Search Bar -->
            <div class="mt-8 max-w-xl mx-auto">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Search for an AI tool..." class="w-full py-3 px-4 pr-10 rounded-lg search-input focus:outline-none">
                    <i class="fas fa-search absolute right-3 top-3 text-cyan-400"></i>
                </div>
            </div>
            
            <!-- Category Filters -->
            <div class="flex flex-wrap justify-center gap-2 mt-6">
                <button class="category-btn active px-4 py-2 rounded-lg" data-category="all">All Tools</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="ai">AI Generation</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="security">Security</button>
                <button class="category-btn px-4 py-2 rounded-lg" data-category="browser">Browser Tools</button>
            </div>
        </header>
        
        <!-- Sites Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="sitesContainer">
            <!-- Sites will be dynamically inserted here -->
        </div>
        
        <!-- Footer -->
        <footer class="mt-12 text-center text-cyan-200 text-sm">
            <p class="mb-2">This directory is for informational purposes only. Always use AI tools responsibly and ethically.</p>
            <p>Made with <i class="fas fa-heart text-red-500"></i> for AI enthusiasts</p>
        </footer>
    </div>

    <script>
        // AI Tools data with direct URLs
        const aiTools = [
            { 
                name: "FlowGPT", 
                url: "https://flowgpt.com/", 
                category: "ai", 
                icon: "fa-brain",
                description: "AI prompt engineering and generation platform"
            },
            { 
                name: "DiffusionBee", 
                url: "https://diffusionbee.com/", 
                category: "ai", 
                icon: "fa-bee",
                description: "AI image generation tool"
            },
            { 
                name: "ParrotAI", 
                url: "https://www.tryparrotai.com/", 
                category: "ai", 
                icon: "fa-parrot",
                description: "AI-powered content creation"
            },
            { 
                name: "Hugging Face", 
                url: "https://huggingface.co/", 
                category: "ai", 
                icon: "fa-face-smile",
                description: "AI model repository and community"
            },
            { 
                name: "Imarena AI", 
                url: "https://imarena.ai/", 
                category: "ai", 
                icon: "fa-chess-board",
                description: "AI image generation and editing"
            },
            { 
                name: "Shodan", 
                url: "https://www.shodan.io/", 
                category: "security", 
                icon: "fa-shield-alt",
                description: "Search engine for Internet-connected devices"
            },
            { 
                name: "Blackbox AI", 
                url: "https://www.blackbox.ai/", 
                category: "ai", 
                icon: "fa-cube",
                description: "AI code generation and assistance"
            },
            { 
                name: "Browseract", 
                url: "https://www.browseract.com/", 
                category: "browser", 
                icon: "fa-window-restore",
                description: "Browser automation and testing tool"
            },
            { 
                name: "FotoForensics", 
                url: "https://fotoforensics.com/", 
                category: "security", 
                icon: "fa-camera-retro",
                description: "Digital image forensics analysis"
            },
            { 
                name: "ZoomEye", 
                url: "https://www.zoomeye.ai/", 
                category: "security", 
                icon: "fa-eye",
                description: "Cybersecurity search engine"
            }
        ];

        // Function to render tools
        function renderTools(tools) {
            const container = document.getElementById('sitesContainer');
            container.innerHTML = '';
            
            tools.forEach(tool => {
                const toolElement = document.createElement('div');
                toolElement.className = 'gradient-border';
                
                toolElement.innerHTML = `
                    <div class="neon-card rounded-lg p-4 h-full flex flex-col">
                        <a href="${tool.url}" target="_blank" class="site-link block flex-grow">
                            <div class="flex items-center mb-3">
                                <div class="icon-container">
                                    <i class="fas ${tool.icon} text-cyan-400"></i>
                                </div>
                                <h3 class="text-xl font-bold text-cyan-300">${tool.name}</h3>
                            </div>
                            <p class="text-sm text-gray-300 mb-3">${tool.description}</p>
                            <div class="mt-auto">
                                <div class="flex justify-between items-center">
                                    <span class="text-sm px-2 py-1 rounded ${getCategoryColor(tool.category)}">${getCategoryText(tool.category)}</span>
                                    <i class="fas fa-external-link-alt text-cyan-400"></i>
                                </div>
                                <div class="url-text mt-2">${tool.url}</div>
                            </div>
                        </a>
                    </div>
                `;
                
                container.appendChild(toolElement);
            });
        }

        // Helper functions for categories
        function getCategoryColor(category) {
            switch(category) {
                case 'ai': return 'bg-purple-900 text-purple-200';
                case 'security': return 'bg-red-900 text-red-200';
                case 'browser': return 'bg-blue-900 text-blue-200';
                default: return 'bg-gray-700 text-gray-200';
            }
        }

        function getCategoryText(category) {
            switch(category) {
                case 'ai': return 'AI Generation';
                case 'security': return 'Security';
                case 'browser': return 'Browser Tools';
                default: return 'Other';
            }
        }

        // Filter tools by category
        function filterTools(category) {
            if (category === 'all') {
                return aiTools;
            }
            return aiTools.filter(tool => tool.category === category);
        }

        // Search functionality
        function searchTools(query) {
            return aiTools.filter(tool => 
                tool.name.toLowerCase().includes(query.toLowerCase()) ||
                tool.description.toLowerCase().includes(query.toLowerCase())
            );
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            // Render all tools initially
            renderTools(aiTools);
            
            // Category filter buttons
            document.querySelectorAll('.category-btn').forEach(button => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    const category = button.getAttribute('data-category');
                    const filteredTools = filterTools(category);
                    renderTools(filteredTools);
                });
            });
            
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const query = e.target.value;
                if (query.length > 0) {
                    const searchedTools = searchTools(query);
                    renderTools(searchedTools);
                } else {
                    // If search is empty, show tools based on active category
                    const activeCategory = document.querySelector('.category-btn.active').getAttribute('data-category');
                    const filteredTools = filterTools(activeCategory);
                    renderTools(filteredTools);
                }
            });
        });
    </script>
</body>
</html>
