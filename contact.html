<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Websites Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: linear-gradient(145deg, #0c0c14 0%, #12121f 40%, #0e0e1a 100%);
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; pointer-events: none; z-index: -2;
      width: 500px; height: 500px; border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.08), transparent);
      top: -10%; left: -10%;
      animation: blobFloat 20s ease-in-out infinite;
    }
    body::after {
      content: ''; position: fixed; pointer-events: none; z-index: -2;
      width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.06), transparent);
      bottom: -10%; right: -10%;
      animation: blobFloat 25s ease-in-out infinite reverse;
    }
    @keyframes blobFloat {
      0%,100% { transform:translate(0,0); }
      33% { transform:translate(30px,-30px); }
      66% { transform:translate(-20px,20px); }
    }
    .nav-bg { background:rgba(12,12,20,0.85); backdrop-filter:blur(14px); border-bottom:1px solid rgba(255,255,255,0.04); }
    .card {
      background: linear-gradient(145deg, rgba(22,22,36,0.65), rgba(16,16,26,0.75));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 16px;
      transition: all 0.45s cubic-bezier(0.2,0.9,0.3,1);
      animation: fadeUp 0.6s ease-out forwards;
      opacity: 0;
    }
    .card:hover { transform: translateY(-4px); border-color:rgba(255,255,255,0.07); box-shadow: 0 20px 60px rgba(0,0,0,0.35); }
    @keyframes fadeUp {
      0% { opacity:0; transform:translateY(20px); }
      100% { opacity:1; transform:translateY(0); }
    }
    .card:nth-child(1) { animation-delay:0.05s; }
    .card:nth-child(2) { animation-delay:0.1s; }
    .card:nth-child(3) { animation-delay:0.15s; }
    .form-input {
      background:rgba(18,18,28,0.7); border:1px solid rgba(255,255,255,0.06);
      border-radius:10px; padding:0.75rem 1rem; color:white; width:100%;
      transition:all 0.3s ease; backdrop-filter:blur(5px);
      font-family:inherit; font-size:0.875rem;
    }
    .form-input:focus { outline:none; border-color:rgba(139,92,246,0.35); box-shadow:0 0 0 3px rgba(139,92,246,0.08); }
    .form-input::placeholder { color:rgba(255,255,255,0.15); }
    .form-label { display:block; margin-bottom:0.4rem; color:#a78bfa; font-weight:500; font-size:0.85rem; }
    .submit-btn {
      background:linear-gradient(135deg,#7c3aed,#3b82f6); border:none;
      border-radius:10px; padding:0.75rem 2rem; color:white; font-weight:600;
      cursor:pointer; transition:all 0.3s ease; font-family:inherit; font-size:0.875rem;
    }
    .submit-btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(124,58,237,0.25); }
    .icon-circle {
      display:inline-flex; align-items:center; justify-content:center;
      width:56px; height:56px; border-radius:50%;
      background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.05);
      backdrop-filter:blur(5px);
    }
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(139,92,246,0.2); border-radius:3px; }
  </style>
</head>
<body class="min-h-screen">
  <!-- Navbar -->
  <nav class="nav-bg fixed top-0 left-0 w-full z-50 px-4 md:px-8">
    <div class="max-w-2xl mx-auto flex items-center justify-between h-14 md:h-16">
      <a href="/" class="flex items-center gap-2 text-white font-bold text-lg">
        <i class="fas fa-star text-purple-400 text-xl"></i>
        <span class="hidden xs:inline">Websites Hub</span>
        <span class="xs:hidden">Hub</span>
      </a>
      <div class="flex items-center gap-5 text-sm">
        <a href="/" class="text-gray-400 hover:text-purple-400 transition flex items-center gap-1.5"><i class="fas fa-home"></i><span class="hidden sm:inline">Home</span></a>
        <a href="/about.html" class="text-gray-400 hover:text-purple-400 transition flex items-center gap-1.5"><i class="fas fa-info-circle"></i><span class="hidden sm:inline">About</span></a>
        <a href="/contact.html" class="text-white hover:text-purple-400 transition flex items-center gap-1.5"><i class="fas fa-envelope"></i><span class="hidden sm:inline">Contact</span></a>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 pt-24 pb-16">
    <div class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-white">Get In Touch</h1>
      <p class="text-gray-500 text-sm mt-1">Have questions or suggestions? Reach out!</p>
    </div>

    <!-- Form Card -->
    <div class="card p-5 sm:p-8 mb-6">
      <form id="contactForm" class="space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label"><i class="fas fa-user mr-1.5"></i>Your Name</label>
            <input type="text" id="name" class="form-input" placeholder="Enter your name" required />
          </div>
          <div>
            <label class="form-label"><i class="fas fa-envelope mr-1.5"></i>Your Email</label>
            <input type="email" id="email" class="form-input" placeholder="Enter your email" required />
          </div>
        </div>
        <div>
          <label class="form-label"><i class="fas fa-tag mr-1.5"></i>Subject</label>
          <input type="text" id="subject" class="form-input" placeholder="What is this regarding?" required />
        </div>
        <div>
          <label class="form-label"><i class="fas fa-comment mr-1.5"></i>Your Message</label>
          <textarea id="message" rows="5" class="form-input" placeholder="Type your message here..." required></textarea>
        </div>
        <button type="submit" class="submit-btn w-full sm:w-auto"><i class="fas fa-paper-plane mr-2"></i>Send Message</button>
      </form>
    </div>

    <!-- Other Ways to Connect -->
    <div class="card p-5 sm:p-8">
      <h2 class="text-lg font-bold text-purple-400 mb-5 text-center">Other Ways to Connect</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
        <div class="text-center">
          <div class="icon-circle mx-auto text-purple-400"><i class="fas fa-envelope text-xl"></i></div>
          <h3 class="text-sm font-semibold text-white mt-3">Email</h3>
          <p class="text-gray-500 text-xs mt-0.5">amit192400@gmail.com</p>
        </div>
        <div class="text-center">
          <div class="icon-circle mx-auto text-purple-400"><i class="fas fa-comments text-xl"></i></div>
          <h3 class="text-sm font-semibold text-white mt-3">Chat</h3>
          <div class="flex flex-col gap-2 mt-2.5">
            <a href="https://wa.me/919876543210?text=Hi%20Amit,%20I%20found%20your%20website!" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white text-xs transition py-1.5 px-3 border border-white/10 rounded-lg hover:border-purple-400/40"><i class="fab fa-whatsapp text-green-400 mr-1.5"></i>WhatsApp</a>
            <a href="https://t.me/yourusername" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-white text-xs transition py-1.5 px-3 border border-white/10 rounded-lg hover:border-purple-400/40"><i class="fab fa-telegram text-blue-400 mr-1.5"></i>Telegram</a>
            <a href="mailto:amit192400@gmail.com" class="text-gray-400 hover:text-white text-xs transition py-1.5 px-3 border border-white/10 rounded-lg hover:border-purple-400/40"><i class="fas fa-envelope text-purple-400 mr-1.5"></i>Email Me</a>
          </div>
        </div>
        <div class="text-center">
          <div class="icon-circle mx-auto text-purple-400"><i class="fas fa-map-marker-alt text-xl"></i></div>
          <h3 class="text-sm font-semibold text-white mt-3">Location</h3>
          <p class="text-gray-500 text-xs mt-0.5">India</p>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      alert(`Thank you, ${name}! Your message has been sent.`);
      e.target.reset();
    });
  </script>
</body>
</html>
