          #1a1a2e 50%,
          #16213e 100%
        );
        color: #e2e8f0;
        min-height: 100vh;
      }

      .neon-card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(99, 102, 241, 0.3);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.2),
          inset 0 0 15px rgba(99, 102, 241, 0.1);
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
      }

      .neon-card:hover {
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.4),
          inset 0 0 20px rgba(99, 102, 241, 0.2);
        transform: translateY(-5px);
      }

      .neon-text {
        text-shadow: 0 0 5px rgba(99, 102, 241, 0.7),
          0 0 10px rgba(99, 102, 241, 0.5);
      }

      .search-box {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(99, 102, 241, 0.3);
        box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
      }

      .party-nda {
        color: #ff6b6b;
        text-shadow: 0 0 5px rgba(255, 107, 107, 0.7);
      }

      .party-mgb {
        color: #4dabf7;
        text-shadow: 0 0 5px rgba(77, 171, 247, 0.7);
      }

      .voting-date {
        color: #ffd43b;
        text-shadow: 0 0 5px rgba(255, 212, 59, 0.7);
      }

      .district-name {
        color: #63e6be;
        text-shadow: 0 0 5px rgba(99, 230, 190, 0.7);
      }

      .constituency-number {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: bold;
      }

      .glow {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
      }

      .scroll-to-top {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(99, 102, 241, 0.8);
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        transition: all 0.3s ease;
        z-index: 100;
      }

      .scroll-to-top:hover {
        background: rgba(99, 102, 241, 1);
        transform: scale(1.1);
      }

      .results-count {
        color: #a5b4fc;
        font-size: 0.9rem;
      }

      // Function to render constituencies
      function renderConstituencies(data) {
        const container = document.getElementById('constituenciesContainer');
        container.innerHTML = '';

        // Update results count
        document.getElementById(
          'resultsCount',
        ).textContent = `Showing ${data.length} of ${electionData.length} constituencies`;

        data.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'neon-card rounded-xl p-6';

          // Format MGB candidates if there are multiple
          let mgbCandidates = '';
          if (Array.isArray(item.mgb)) {
            mgbCandidates = item.mgb
              .map(
                (candidate) =>
                  `<div class="mb-2">
                            <span class="party-mgb font-semibold">${candidate.party}</span>: ${candidate.candidate}
                        </div>`,
              )
              .join('');
          } else {
            mgbCandidates = `
                        <div class="mb-2">
                            <span class="party-mgb font-semibold">${item.mgb.party}</span>: ${item.mgb.candidate}
                        </div>
                    `;
          }

          card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="voting-date text-sm font-semibold">${item.votingDate}</span>
                            <div class="district-name text-lg font-bold mt-1">${item.district}</div>
                        </div>
                        <div class="constituency-number text-2xl">${item.constituency}</div>
                    </div>
                    
                    <h3 class="text-xl font-bold text-white mb-4">${item.name}</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-indigo-900/30 p-3 rounded-lg">
                            <div class="text-center party-nda font-bold mb-2">NDA</div>
                            <div class="text-center">
                                <span class="font-semibold">${item.nda.party}</span><br>
                                ${item.nda.candidate}
                            </div>
                        </div>
                        
                        <div class="bg-indigo-900/30 p-3 rounded-lg">
                            <div class="text-center party-mgb font-bold mb-2">MGB</div>
                            <div class="text-center">
                                ${mgbCandidates}
                            </div>
                        </div>
                    </div>
                `;

          container.appendChild(card);
        });
      }

      // Initial render
      renderConstituencies(electionData);

      // Search functionality
      document
        .getElementById('searchInput')
        .addEventListener('input', function (e) {
          const searchTerm = e.target.value.toLowerCase();

          if (searchTerm === '') {
            renderConstituencies(electionData);
            return;
          }

          const filteredData = electionData.filter(
            (item) =>
              item.district.toLowerCase().includes(searchTerm) ||
              item.name.toLowerCase().includes(searchTerm) ||
              item.nda.candidate.toLowerCase().includes(searchTerm) ||
              (Array.isArray(item.mgb)
                ? item.mgb.some((candidate) =>
                    candidate.candidate.toLowerCase().includes(searchTerm),
                  )
                : item.mgb.candidate.toLowerCase().includes(searchTerm)),
          );

          renderConstituencies(filteredData);
        });

      // Filter by voting date
      document.querySelectorAll('.filter-btn').forEach((button) => {
        button.addEventListener('click', function () {
          const filter = this.getAttribute('data-filter');

          let filteredData;
          if (filter === 'all') {
            filteredData = electionData;
          } else if (filter === 'nov6') {
            filteredData = electionData.filter(
              (item) => item.votingDate === '6 November 2025',
            );
          } else if (filter === 'nov11') {
            filteredData = electionData.filter(
              (item) => item.votingDate === '11 November 2025',
            );
          }

          renderConstituencies(filteredData);
        });
      });

      // Scroll to top functionality
      document
        .getElementById('scrollToTop')
        .addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

      // Show/hide scroll to top button based on scroll position
      window.addEventListener('scroll', function () {
        const scrollToTopBtn = document.getElementById('scrollToTop');
        if (window.pageYOffset > 300) {
          scrollToTopBtn.style.display = 'flex';
        } else {
          scrollToTopBtn.style.display = 'none';
        }
      });
    </script>
